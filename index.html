<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2233">
<title>Log Latihan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F0; --card:#FFFFFF; --ink:#1B2233; --soft:#5B6475; --line:#D3D9D7;
  --plate:#C62839; --plate-ink:#FFFFFF; --mat:#2F4A7A; --ok:#2E7D5B; --warn:#A8651A;
  --num:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --txt:'Barlow','Roboto',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#121821;--card:#1B2330;--ink:#E7EBEF;--soft:#98A2B3;--line:#2B3546;
  --plate:#E0485A;--mat:#86A7E3;--ok:#5CB88E;--warn:#E0A75A;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--txt);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mat);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 120px}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
h1{font-family:var(--num);font-weight:700;font-size:1.7rem;white-space:nowrap;letter-spacing:.01em;margin:0;line-height:1}
h2{font-family:var(--num);font-weight:700;font-size:1.35rem;margin:0 0 4px;line-height:1.1}
h3{font-family:var(--num);font-weight:700;font-size:1.1rem;margin:0 0 4px;line-height:1.15}
.muted{color:var(--soft);font-size:.9rem}
.seg{display:flex;flex-wrap:wrap;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;font-family:var(--num);font-weight:700;font-size:1.15rem;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.person{margin-top:10px}
.person button[aria-pressed="true"]{background:var(--plate);color:var(--plate-ink)}
.meta{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta input[type=date]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px}
.chip{font-family:var(--num);font-weight:600;font-size:.95rem;text-align:right;line-height:1.15;padding:3px 9px;border-radius:999px;background:var(--mat);color:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.ex-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.target{font-family:var(--num);font-weight:600;font-size:1.05rem;color:var(--mat);white-space:nowrap}
.cue{font-size:.88rem;color:var(--soft);margin:2px 0 8px}
.sug{border-left:4px solid var(--plate);padding:6px 10px;margin:8px 0;background:color-mix(in srgb,var(--plate) 7%,transparent);border-radius:0 8px 8px 0;font-size:.93rem}
.sug.hold{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.last{font-size:.88rem;color:var(--soft)}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.set{font-family:var(--num);font-weight:600;font-size:1.05rem;border:1.5px solid var(--ink);border-radius:8px;padding:2px 4px 2px 8px;display:flex;align-items:center;gap:4px}
.set.over{border-color:var(--warn);color:var(--warn)}
.set button{border:0;background:transparent;color:var(--soft);font-size:1rem;padding:2px 6px;border-radius:6px}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.stepper label{display:block;font-size:.8rem;color:var(--soft);margin-bottom:2px}
.stepper .ctl{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.stepper button{width:42px;border:0;background:transparent;font-size:1.4rem;font-weight:600}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--num);font-weight:700;font-size:1.7rem;padding:4px 0}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:600;background:var(--ink);color:var(--paper);width:100%}
.btn.plate{background:var(--plate);color:var(--plate-ink);font-family:var(--num);font-size:1.25rem;letter-spacing:.02em;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:.9rem}
.btn.danger{background:transparent;border:1.5px solid var(--plate);color:var(--plate)}
.note{font-size:.88rem;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--warn);color:var(--ink);margin:10px 0}
.note b{color:var(--warn)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;padding:12px 2px 14px;font-family:var(--num);font-weight:600;font-size:.98rem;color:var(--soft);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--plate)}
#timer{position:fixed;left:0;right:0;bottom:62px;z-index:7;display:none;justify-content:center;padding:0 12px}
#timer .in{max-width:560px;width:100%;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#timer .clock{font-family:var(--num);font-weight:700;font-size:2.2rem;min-width:88px;text-align:center;line-height:1}
#timer .lbl{flex:1;font-size:.85rem;line-height:1.25}
#timer .bar{height:4px;background:color-mix(in srgb,var(--paper) 25%,transparent);border-radius:4px;margin-top:6px;overflow:hidden}
#timer .bar i{display:block;height:100%;background:var(--plate)}
#timer button{border:0;border-radius:8px;background:color-mix(in srgb,var(--paper) 15%,transparent);color:var(--paper);padding:8px 9px;font-weight:600}
#timer.done .in{background:var(--plate)}
.pain input[type=range]{width:100%;accent-color:var(--plate)}
.painval{font-family:var(--num);font-weight:700;font-size:2rem}
.hist-item summary{list-style:none;cursor:pointer}
.hist-item summary::-webkit-details-marker{display:none}
.hist-item .sum{display:flex;justify-content:space-between;gap:8px}
.hist-ex{margin:8px 0;font-size:.93rem}
.hist-ex b{font-weight:600}
select{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;width:100%}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font-family:var(--num);fill:var(--soft);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:600;color:var(--soft)}
.big{font-family:var(--num);font-weight:700;font-size:1.6rem}
.field{margin:10px 0}
.field label{display:block;font-size:.85rem;color:var(--soft);margin-bottom:3px}
.field input[type=text],.field input[type=number],.field input[type=date]{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;z-index:9;font-size:.92rem;display:none}
details.sub{border:1px solid var(--line);border-radius:14px;padding:2px 14px 14px;margin:12px 0;background:var(--card)}
details.sub>summary{cursor:pointer;font-family:var(--num);font-weight:700;font-size:1.2rem;list-style:none;padding:12px 0}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary::before{content:'▸ ';color:var(--mat)}
details.sub[open]>summary::before{content:'▾ '}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .who{min-width:0}
.list-row .who b{display:block;font-size:.96rem}
.tagline{font-size:.8rem;color:var(--soft)}
.iconbtn{border:0;background:transparent;color:var(--soft);padding:5px 9px;border-radius:8px;font-size:1rem;white-space:nowrap}
.iconbtn.danger{color:var(--plate)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:7px;font-size:.92rem;margin:8px 0}
.miniform{border:1.5px dashed var(--line);border-radius:12px;padding:10px;margin-top:8px}
.dayrow{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;margin:5px 0}
.ex-head{display:flex;gap:10px;align-items:flex-start}
.ex-head .grow{flex:1;min-width:0}
.thumb{width:56px;height:56px;border-radius:10px;border:1px solid var(--line);background:#fff;object-fit:cover;flex:0 0 auto;padding:0;cursor:pointer}
.thumb.sm{width:44px;height:44px}
.media-box{margin:8px 0;text-align:center}
.media-box img{width:180px;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.credit{font-size:.72rem;color:var(--soft);margin-top:3px}
.credit a{color:inherit}
.wu{border-left:4px solid var(--ok)}
.wu.done{opacity:.75}
.wu-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.wu-item:last-child{border-bottom:0}
.wu-item input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:0 0 auto}
.wu-item .grow{flex:1;min-width:0}
.wu-item .dose{font-family:var(--num);font-weight:600;color:var(--mat);font-size:1rem}
.wu-item.checked .grow b{text-decoration:line-through;color:var(--soft)}
.noimg{width:44px;height:44px;border-radius:10px;border:1px dashed var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:.65rem;color:var(--soft);text-align:center;line-height:1.1}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pickgrid button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:4px;font-size:.72rem;line-height:1.2;text-align:center}
.pickgrid button img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#fff}
.pickgrid button[aria-pressed="true"]{border-color:var(--plate);border-width:2.5px}
.badge{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="topbar"></div></header>

<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

function bpToRegion(bp){
  if(bp==='upper legs'||bp==='lower legs')return'bawah';
  if(bp==='waist')return'core';
  if(bp==='cardio')return'kardio';
  return'atas';
}
function regionOf(ex){
  if(ex.region)return ex.region;
  if(ex.media&&CATMAP[ex.media])return bpToRegion(CATMAP[ex.media][3]);
  return'seluruh';
}
function eqToLoad(eq){
  if(eq==='body weight'||eq==='assisted')return{loadLabel:'kg tambahan',inc:0,step:1};
  if(eq==='dumbbell')return{loadLabel:'kg / dumbbell',inc:2.5,step:1};
  if(eq==='kettlebell')return{loadLabel:'kg',inc:4,step:2};
  if(['leverage machine','cable','sled machine','smith machine'].includes(eq))return{loadLabel:'kg (mesin)',inc:2.5,step:2.5};
  return{loadLabel:'kg',inc:2.5,step:1};
}
function searchCat(q,bp){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean).map(w=>SEARCH_ALIAS[w]||w);
  const out=[];
  for(const r of CAT){
    if(bp&&r[3]!==bp)continue;
    const n=r[2].toLowerCase();
    if(words.every(w=>n.includes(w)))out.push(r);
    if(out.length>=24)break;
  }
  return out;
}

function warnFor(r,profile){
  if(!r)return'';

  if(profile.painTracking){

/* ================= Perkiraan durasi sesi ================= */
function estMinutes(profile,items){
  let s=0;
  items.forEach(it=>{
    const ex=profile.exercises[it.exId];if(!ex)return;
    const avg=(it.lo+it.hi)/2;
    let work=ex.unit==='reps'?avg*3:(ex.unit==='s'?avg:avg*1.2); // ±3 dtk per repetisi, ±1,2 dtk per meter
    if(ex.perSide)work*=2;
    s+=it.sets*(work+it.rest)+45; // +45 dtk pindah alat & atur beban
  });
  return Math.round(s/60);
}

function sessionRegions(profile,items){
  const s=new Set();
  items.forEach(i=>{const ex=profile.exercises[i.exId];if(!ex)return;const r=regionOf(ex);if(r==='seluruh'){s.add('bawah');s.add('atas')}else s.add(r)});
  return s;
}
function recommend(profile,items){
  const R=sessionRegions(profile,items),pain=!!profile.painTracking;
  const lowW=pain?['bridge','sideabd','ankle']:['bridge','wgs','highknee'];
  const upW=['dynchest','armcircle','sidereach'];
  const lowC=pain?['ham','calf','glute']:['ham','quad','calf'];
  const upC=['chest','upback','tri'];
  let w=[],c=[];
  const lo=R.has('bawah'),up=R.has('atas'),co=R.has('core');
  if(lo&&up){w=[...lowW.slice(0,2),...upW.slice(0,2)];c=[...lowC.slice(0,2),...upC.slice(0,2)]}
  else if(lo){w=[...lowW,'pelvic'];c=[...lowC,'lat']}
  else if(up){w=[...upW,'pelvic'];c=[...upC,'lat']}
  else if(co){w=['pelvic','deadbug','bridge'];c=['lat','ham','glute']}
  return{sig:[...R].sort().join(',')+'|'+(pain?1:0),regions:[...R],warm:['gen',...w],cool:['walk',...c]};
}

function upgrade(d){
  const sc=d.schema||0;
  if(sc>=5)return false;
  if(sc<3){
    const OLD_WU='Pemanasan: ~5 menit sepeda statis (air bike), seperti kebiasaan lama, sebelum mulai set kerja di bawah.';
    Object.values(d.profiles).forEach(p=>{
      enrichEx(p.exercises);
      Object.values(p.plan).forEach(ph=>Object.values(ph).forEach(s=>{if(s.note===OLD_WU)s.note=''}));
      confirmAll(p);
    });
  }
  // ID internal lama 'tyo'/'istri' -> 'juan'/'annie' (hanya terlihat di file cadangan)
  const MAP={tyo:'juan',istri:'annie'};
  Object.keys(MAP).forEach(o=>{
    const n=MAP[o];
    if(!d.profiles[o]||d.profiles[n])return;
    d.profiles[n]=d.profiles[o];d.profiles[n].id=n;delete d.profiles[o];
    (d.logs||[]).forEach(l=>{if(l.profileId===o)l.profileId=n});
    if(d.activeProfile===o)d.activeProfile=n;
  });
  // urutkan ulang supaya JuAn tetap tampil pertama
  const order=['juan','annie'].filter(k=>d.profiles[k]).concat(Object.keys(d.profiles).filter(k=>k!=='juan'&&k!=='annie'));
  const np={};order.forEach(k=>np[k]=d.profiles[k]);d.profiles=np;
  // tanggal akhir langganan gym JuAn & AnNie (untuk saringan alat default di katalog)
  ['juan','annie'].forEach(k=>{if(d.profiles[k]&&d.profiles[k].gymUntil===undefined)d.profiles[k].gymUntil='2027-01-12'});
  d.schema=5;return true;
}

function phaseOf(profile,date){return profile.phases.find(p=>date<p.until)||profile.phases[profile.phases.length-1]}

  if(!l){l={id:uid('log'),profileId:profile.id,date,sess,phase:phaseOf(profile,date).key,entries:{},painDuring:null,painNextDay:null};db.logs.push(l)}
  return l;
}
function planForLog(profile,date,sess){

  const ph=lg?lg.phase:phaseOf(profile,date).key;
  const p=profile.plan[ph]&&profile.plan[ph][sess];
  return{phase:ph,note:(p&&p.note)||'',items:(p&&p.items)||[],warmSig:(p&&p.warmSig)||null};
}
function lastEntry(profileId,exId,beforeDate){
  const list=db.logs.filter(l=>l.profileId===profileId&&l.date<beforeDate&&l.entries[exId]&&l.entries[exId].length).sort((a,b)=>a.date<b.date?1:-1);
  return list.length?{date:list[0].date,sets:list[0].entries[exId]}:null;
}
function lastPain(profileId,beforeDate){
  const l=db.logs.filter(x=>x.profileId===profileId&&x.date<beforeDate&&(x.painDuring!=null||x.painNextDay!=null)).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(!l)return null;
  return Math.max(l.painDuring??0,l.painNextDay??0);
}
function suggest(itDef,ex,profile,date){
  const lo=itDef.lo,hi=itDef.hi,last=lastEntry(profile.id,itDef.exId,date),inc=ex.inc||0;
  if(!last)return{w:null,r:lo,hold:false,text:`Belum ada catatan. Cari beban yang terasa berat tapi rapi di ${lo} ${UNIT[ex.unit]}, sisakan tenaga 2–3 ${UNIT[ex.unit]}.`};
  const top=Math.max(...last.sets.map(s=>s.w));
  const atTop=last.sets.filter(s=>s.w===top);
  const best=Math.max(...atTop.map(s=>s.r));
  if(profile.techEnd&&date<profile.techEnd)return{w:top,r:lo,hold:true,text:`Minggu teknik (s.d. ${fmtShort(addDays(profile.techEnd,-1))}): fokus gerakan rapi. Sesuaikan beban sampai ${lo}–${hi} ${UNIT[ex.unit]} terasa berat tapi rapi.`};
  if(profile.painTracking&&ex.knee){const p=lastPain(profile.id,date);if(p!=null&&p>3)return{w:top,r:lo,hold:true,text:`Nyeri sesi terakhir ${p}/10 (di atas 3). Jangan naikkan beban; kurangi beban atau rentang gerak bila perlu.`}}
  const full=atTop.length>=itDef.sets&&atTop.slice(0,itDef.sets).every(s=>s.r>=hi);
  if(full){
    if(!inc)return{w:top,r:lo,hold:false,text:`Semua set mencapai ${hi} ${UNIT[ex.unit]}. Tambah sedikit beban (kalau ada) atau pilih variasi yang lebih sulit.`};
    return{w:top+inc,r:lo,hold:false,text:`Semua set mencapai ${hi} ${UNIT[ex.unit]}. Naikkan ke ${kg(top+inc)} ${ex.loadLabel}, mulai lagi dari ${lo} ${UNIT[ex.unit]}.`};
  }
  const nr=Math.min(hi,best+(ex.unit==='reps'?1:5));
  return{w:top,r:nr,hold:false,text:`Beban tetap ${kg(top)} ${ex.loadLabel}. Target: tambah ${ex.unit==='reps'?'1 repetisi':'5 '+UNIT[ex.unit]} sampai semua set mencapai ${hi}.`};
}

function audioUnlock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  try{audioUnlock();const t0=actx.currentTime;[0,.35,.7].forEach(o=>{const g=actx.createGain(),osc=actx.createOscillator();osc.type='square';osc.frequency.value=880;g.gain.setValueAtTime(.0001,t0+o);g.gain.exponentialRampToValueAtTime(.35,t0+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+o+.25);osc.connect(g).connect(actx.destination);osc.start(t0+o);osc.stop(t0+o+.27)})}catch(e){}
  if(navigator.vibrate)navigator.vibrate([400,150,400,150,400]);
}
function startTimer(sec,label,prefix,doneText){T.prefix=prefix||'Istirahat';T.doneText=doneText||'Waktunya set berikutnya';T.end=Date.now()+sec*1000;T.total=sec;T.alerted=false;T.label=label;document.getElementById('timer').style.display='flex';document.getElementById('timer').classList.remove('done');tick();clearInterval(T.iv);T.iv=setInterval(tick,250)}
function tick(){
  const left=Math.max(0,Math.round((T.end-Date.now())/1000));
  document.getElementById('tclock').textContent=Math.floor(left/60)+':'+pad(left%60);
  document.getElementById('tlabel').textContent=left>0?T.prefix+' · '+T.label:T.doneText;
  document.getElementById('tbar').style.width=(T.total?100*(1-left/T.total):100)+'%';
  if(left===0&&!T.alerted&&document.visibilityState==='visible'){T.alerted=true;document.getElementById('timer').classList.add('done');beep()}
}

function seriesFor(profileId,exId){
  return db.logs.filter(l=>l.profileId===profileId&&l.entries[exId]&&l.entries[exId].length).sort((a,b)=>a.date<b.date?-1:1)
    .map(l=>{const a=l.entries[exId];const top=Math.max(...a.map(x=>x.w));return{date:l.date,top,reps:Math.max(...a.filter(x=>x.w===top).map(x=>x.r)),sets:a}});
}
function projection(pts,ceiling,projFrom){
  const use=projFrom?pts.filter(p=>p.date>=projFrom):pts;
  if(use.length<3)return{ok:false,msg:`Butuh minimal 3 sesi${projFrom?' sejak '+fmtShort(projFrom):''}. Sekarang: ${use.length}.`};
  const span=dayDiff(use[0].date,use[use.length-1].date);
  if(span<14)return{ok:false,msg:'Data baru mencakup '+span+' hari. Butuh minimal 14 hari agar trennya bermakna.'};
  const xs=use.map(p=>dayDiff(use[0].date,p.date)),ys=use.map(p=>p.top),n=xs.length;
  const mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let sxy=0,sxx=0;xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-my);sxx+=(x-mx)**2});
  const slope=sxx?sxy/sxx:0,icp=my-slope*mx,lastX=xs[n-1],fitNow=icp+slope*lastX,perWeek=slope*7;
  if(fitNow>=ceiling)return{ok:true,perWeek,msg:`Tren sudah di atau melewati ${ceiling}.`,reached:true};
  if(slope<=0)return{ok:true,perWeek,msg:'Belum ada tren naik dari data sejauh ini, jadi tanggal mentok belum bisa diproyeksikan.'};
  const days=Math.ceil((ceiling-fitNow)/slope);const d=pd(use[n-1].date);d.setDate(d.getDate()+days);
  return{ok:true,perWeek,date:ds(d),days,msg:''};
}
function chartSVG(pts,ceiling,showCeil){
  if(!pts.length)return'';
  const W=520,H=220,L=36,R=12,T=14,B=28;
  const t0=pd(pts[0].date).getTime(),t1=Math.max(pd(pts[pts.length-1].date).getTime(),t0+864e5);
  let ymax=Math.max(...pts.map(p=>p.top));if(showCeil)ymax=Math.max(ymax,ceiling);ymax=Math.max(5,Math.ceil(ymax/5)*5);
  const X=d=>L+(pd(d).getTime()-t0)/(t1-t0)*(W-L-R),Y=v=>T+(1-v/ymax)*(H-T-B);
  let g='';for(let v=0;v<=ymax;v+=ymax>30?10:5)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  if(showCeil)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(ceiling)}" y2="${Y(ceiling)}" stroke="var(--plate)" stroke-dasharray="5 4"/><text x="${W-R}" y="${Y(ceiling)-5}" text-anchor="end" style="fill:var(--plate)">batas ${ceiling}</text>`;
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.date).toFixed(1)+' '+Y(p.top).toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${X(p.date)}" cy="${Y(p.top)}" r="4" fill="var(--mat)"><title>${fmtShort(p.date)}: ${kg(p.top)} × ${p.reps}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik beban teratas per sesi">${g}<path d="${path}" fill="none" stroke="var(--mat)" stroke-width="2.5"/>${dots}
  <text x="${L}" y="${H-8}">${fmtShort(pts[0].date)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fmtShort(pts[pts.length-1].date)}</text></svg>`;
}

function programSchedule(profile){

    return `<div class="dayrow"><label class="muted" for="day${w}">${DAYS[w]}</label><select id="day${w}" data-action="dayMap" data-day="${w}"><option value="">– (tidak disarankan)</option>${profile.sessionTypes.map(st=>`<option value="${st.key}" ${cur===st.key?'selected':''}>${esc(st.label)}</option>`).join('')}</select></div>`;
  }).join('');
  const sessRows=profile.sessionTypes.map(st=>`<div class="list-row"><div class="who"><b>${esc(st.label)}</b><span class="tagline">kode: ${esc(st.key)}</span></div>
    ${profile.sessionTypes.length>1?`<button class="iconbtn danger" data-action="delSessType" data-id="${profile.id}" data-key="${st.key}">Hapus</button>`:''}</div>`).join('');
  return `<details class="sub" ${subAttr('sched',false)}><summary>Jenis sesi &amp; jadwal · ${esc(profile.name)}</summary>
    <h3>Jenis sesi</h3>${sessRows}
    <div class="miniform"><div class="field"><label>Nama sesi baru</label><input type="text" id="newSessLabel" placeholder="Misal: Sesi C"></div>

    <h3 style="margin-top:14px">Hari disarankan</h3><p class="muted">Menentukan sesi apa yang otomatis disarankan saat membuka tab Latihan pada hari itu.</p>
    ${days}</details>`;
}
function programPhases(profile){
  const rows=profile.phases.map((p,i)=>{
    const isLast=i===profile.phases.length-1;
    return `<div class="list-row"><div class="who"><b>${esc(p.name)}</b><div class="tagline">${isLast?'berlaku seterusnya':'sampai '+fmtShort(p.until)}</div></div>
      <div class="row" style="gap:2px">
        ${i>0?`<button class="iconbtn" data-action="movePhase" data-key="${p.key}" data-dir="-1" aria-label="Naik">↑</button>`:''}
        ${i<profile.phases.length-2?`<button class="iconbtn" data-action="movePhase" data-key="${p.key}" data-dir="1" aria-label="Turun">↓</button>`:''}
        ${profile.phases.length>1?`<button class="iconbtn danger" data-action="delPhase" data-key="${p.key}">Hapus</button>`:''}
      </div></div>
    <div class="miniform"><div class="formgrid">
      <div class="field"><label>Nama fase</label><input type="text" data-f="name" value="${esc(p.name)}"></div>
      ${isLast?'':`<div class="field"><label>Berlaku sampai</label><input type="date" data-f="until" value="${p.until}"></div>`}
    </div><button class="btn small" data-action="savePhase" data-key="${p.key}">Simpan</button></div>`;
  }).join('');
  return `<details class="sub" ${subAttr('phase',false)}><summary>Fase &amp; tanggal mulai · ${esc(profile.name)}</summary>
    <div class="field"><label>Tanggal mulai program (untuk hitung minggu ke-)</label><input type="date" id="startDateIn" value="${profile.startDate}"></div>
    <button class="btn small ghost" data-action="saveStartDate">Simpan tanggal mulai</button>
    <h3 style="margin-top:14px">Fase</h3>${rows}
    <div class="miniform"><div class="field"><label>Nama fase baru</label><input type="text" id="newPhaseName" placeholder="Misal: Fase 2"></div>
      <div class="field"><label>Fase sebelumnya berlaku sampai</label><input type="date" id="newPhaseUntil"></div>
      <button class="btn small" data-action="addPhase">+ Sisipkan fase baru sebelum fase terakhir</button></div></details>`;
}
function programPlan(profile){
  if(!ui.editPhase||!profile.phases.some(p=>p.key===ui.editPhase))ui.editPhase=profile.phases[0].key;
  if(!ui.editSess||!profile.sessionTypes.some(s=>s.key===ui.editSess))ui.editSess=profile.sessionTypes[0]?profile.sessionTypes[0].key:'';
  const phSel=`<select id="planPhaseSel" data-action="planPhase">${profile.phases.map(p=>`<option value="${p.key}" ${p.key===ui.editPhase?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
  const sessSel=`<select id="planSessSel" data-action="planSess">${profile.sessionTypes.map(st=>`<option value="${st.key}" ${st.key===ui.editSess?'selected':''}>${esc(st.label)}</option>`).join('')}</select>`;
  const p=profile.plan[ui.editPhase]&&profile.plan[ui.editPhase][ui.editSess]?profile.plan[ui.editPhase][ui.editSess]:{note:'',items:[]};
  const rows=p.items.map((itDef,i)=>{
    const ex=profile.exercises[itDef.exId];
    return `<div class="list-row"><div class="who"><b>${esc(ex?ex.name:itDef.exId)}</b><div class="tagline">${itDef.sets} × ${itDef.lo}–${itDef.hi} ${ex?UNIT[ex.unit]:''} · istirahat ${itDef.rest}dtk</div></div>
      <div class="row" style="gap:2px">
        ${i>0?`<button class="iconbtn" data-action="movePlanItem" data-i="${i}" data-dir="-1" aria-label="Naik">↑</button>`:''}
        ${i<p.items.length-1?`<button class="iconbtn" data-action="movePlanItem" data-i="${i}" data-dir="1" aria-label="Turun">↓</button>`:''}
        <button class="iconbtn danger" data-action="delPlanItem" data-i="${i}">Hapus</button>
      </div></div>`;
  }).join('');
  const exOpts=Object.keys(profile.exercises).map(id=>`<option value="${id}">${esc(profile.exercises[id].name)}</option>`).join('');
  return `<details class="sub" ${subAttr('plan',true)}><summary>Susunan program per fase &amp; sesi · ${esc(profile.name)}</summary>
    <div class="formgrid"><div class="field"><label>Fase</label>${phSel}</div><div class="field"><label>Sesi</label>${sessSel}</div></div>
    <div class="field"><label>Catatan sesi (tampil di atas tab Latihan)</label><input type="text" id="planNoteIn" value="${esc(p.note)}" placeholder="Misal: pemanasan 5 menit dulu"></div>
    <button class="btn small ghost" data-action="savePlanNote">Simpan catatan</button>
    <h3 style="margin-top:12px">Gerakan dalam sesi ini</h3>
    ${p.items.length?(()=>{const m=estMinutes(profile,p.items),tot=m+5;return`<p class="cue">Perkiraan durasi: <b>±${tot} menit</b> (pemanasan 5 + latihan ${m})${tot>60?' · <span class="badge">lebih dari 60 menit, pertimbangkan mengganti gerakan daripada menambah</span>':''}. Pendinginan opsional +3 menit.</p>`})():''}
    ${rows||'<p class="muted">Belum ada gerakan di sesi ini.</p>'}
    ${Object.keys(profile.exercises).length?`<div class="miniform"><h3>+ Tambah gerakan ke sesi ini</h3>
      <div class="field"><label>Gerakan</label><select id="planAddEx">${exOpts}</select></div>
      <div class="formgrid">
        <div class="field"><label>Jumlah set</label><input type="number" id="planAddSets" value="3"></div>
        <div class="field"><label>Istirahat (detik)</label><input type="number" id="planAddRest" value="90"></div>
        <div class="field"><label>Repetisi minimum</label><input type="number" id="planAddLo" value="8"></div>
        <div class="field"><label>Repetisi maksimum</label><input type="number" id="planAddHi" value="12"></div>
      </div>
      <button class="btn small" data-action="addPlanItem">+ Tambah ke sesi</button></div>`:'<p class="muted">Tambah gerakan dulu di Perpustakaan gerakan di atas.</p>'}
    ${planWarmPreview(profile,p)}
    </details>`;
}
function planWarmPreview(profile,p){
  if(!p.items.length)return'';
  const rec=recommend(profile,p.items),ok=p.warmSig===rec.sig;
  const li=o=>`<div class="wu-item">${o.media&&CATMAP[o.media]?`<img class="thumb sm" src="${thumbURL(o.media)}" alt="" loading="lazy">`:'<span class="noimg">tanpa<br>gambar</span>'}<div class="grow"><b>${esc(o.name)}</b><div class="dose">${esc(o.dose)}</div></div></div>`;
  return`<div class="miniform" style="border-color:${ok?'var(--ok)':'var(--warn)'};border-style:solid">
    <h3>Langkah terakhir: pemanasan &amp; pendinginan</h3>
    <p class="cue">Disusun otomatis dari gerakan di atas (${rec.regions.map(r=>REGION_LABEL[r].toLowerCase()).join(' & ')}).${profile.painTracking?' Profil ini melacak nyeri sendi, jadi tanpa lunge dalam dan tanpa duduk-berdiri berulang.':''}</p>
    <b>Pemanasan · wajib · ±5 menit</b>${rec.warm.map(k=>li(WARM[k])).join('')}
    <b style="display:block;margin-top:8px">Pendinginan · opsional · 3 menit</b>${rec.cool.map(k=>li(COOL[k])).join('')}
    ${ok?'<p class="muted" style="color:var(--ok)">✓ Sudah dikonfirmasi. Pemanasan tampil paling atas di tab Latihan, pendinginan paling bawah.</p>'
      :`<p class="cue">${p.warmSig?'Susunan gerakan berubah sejak konfirmasi terakhir.':'Belum dikonfirmasi.'}</p><button class="btn" data-action="confirmWarm">Konfirmasi susunan sesi</button>`}
    <div class="credit">Gambar: ${CREDIT}</div></div>`;
}

/* ================= Aksi ================= */
function readInputs(exId){
  return{w:num(document.getElementById('w_'+exId).value),r:Math.round(num(document.getElementById('r_'+exId).value))};
}
function readForm(scope){
  const o={};scope.querySelectorAll('[data-f]').forEach(el=>{
    const f=el.dataset.f;
    if(el.type==='checkbox')o[f]=el.checked;
    else if(['inc','step','capReps'].includes(f))o[f]=el.value===''?(f==='capReps'?null:0):num(el.value);
    else o[f]=el.value;
  });
  return o;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.action;
  const profile=curProfile();
  if(a==='tab'){ui.tab=b.dataset.v;render();window.scrollTo(0,0)}
  else if(a==='person'){ui.profileId=b.dataset.v;db.activeProfile=ui.profileId;ui.sess=defSess(curProfile(),ui.date);ui.progEx=null;save();render()}
  else if(a==='sess'){ui.sess=b.dataset.v;render()}
  else if(a==='step'){const inp=document.getElementById(b.dataset.t);let v=num(inp.value)+num(b.dataset.d);if(v<0)v=0;inp.value=Math.round(v*100)/100;inp.dispatchEvent(new Event('input',{bubbles:true}))}
  else if(a==='logset'){
    audioUnlock();
    const exId=b.dataset.ex,{w,r}=readInputs(exId);
    if(r<=0){toast('Isi jumlah repetisi/jarak/waktu dulu.');return}
    const l=getOrCreateLog(profile,ui.date,ui.sess);(l.entries[exId]=l.entries[exId]||[]).push({w,r});save();
    startTimer(+b.dataset.rest,profile.exercises[exId].name);render();
  }
  else if(a==='delset'){const l=findLog(profile.id,ui.date,ui.sess);if(!l)return;l.entries[b.dataset.ex].splice(+b.dataset.i,1);save();render()}
  else if(a==='savepain'){const l=getOrCreateLog(profile,ui.date,ui.sess);l.painDuring=+document.getElementById('painIn').value;save();toast('Skor nyeri disimpan.');render()}
  else if(a==='missPain'){const l=db.logs.find(x=>x.id===b.dataset.id);l.painNextDay=+document.getElementById('missPain').value;save();toast('Nyeri keesokan hari disimpan.');render()}
  else if(a==='delsess'){if(confirm('Hapus sesi ini beserta semua setnya?')){db.logs=db.logs.filter(x=>x.id!==b.dataset.id);save();render()}}
  else if(a==='toggleMedia'){const k=b.dataset.k;openMedia.has(k)?openMedia.delete(k):openMedia.add(k);render()}
  else if(a==='wuTick'){wuDone[b.dataset.k]=b.checked;render()}
  else if(a==='wuTimer'){audioUnlock();startTimer(+b.dataset.sec,b.dataset.l,'Pemanasan/pendinginan','Selesai, lanjut gerakan berikutnya')}
  else if(a==='confirmWarm'){
    const p=profile.plan[ui.editPhase][ui.editSess];p.warmSig=recommend(profile,p.items).sig;
    save();toast('Susunan sesi dikonfirmasi. Pemanasan tampil paling atas di tab Latihan.');render();
  }
  else if(a==='pickMedia'){
    const t=b.dataset.t,m=b.dataset.m,r=CATMAP[m];if(!r)return;
    b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');
    if(t==='new'){
      ui.newExMedia=m;
      const nm=document.getElementById('newExName');if(!nm.value.trim())nm.value=r[2].charAt(0).toUpperCase()+r[2].slice(1);
      const L=eqToLoad(r[4]);
      document.getElementById('newExLoadLabel').value=L.loadLabel;document.getElementById('newExInc').value=L.inc;document.getElementById('newExStep').value=L.step;
      document.getElementById('newExUnit').value=r[3]==='cardio'?'s':'reps';
      document.getElementById('pkcur_new').innerHTML=curMediaHTML(m);
    }else{
      const ex=profile.exercises[t];if(!ex)return;
      ex.media=m;ex.mediaNote='';save();
      document.getElementById('pkcur_'+t).innerHTML=curMediaHTML(m);
      toast('Gambar gerakan disimpan.');
    }
  }
  else if(a==='newMode'){ui.newMode=b.dataset.v;ui.brN=24;render()}
  else if(a==='eqScope'){ui.eqScope=b.dataset.v;ui.brN=24;render()}
  else if(a==='brMore'){ui.brN=(ui.brN||24)+24;document.getElementById('brList').innerHTML=browseList(profile)}
  else if(a==='pickNew'){
    const m=b.dataset.m,r=CATMAP[m];if(!r)return;
    ui.newExMedia=m;render();
    const L=eqToLoad(r[4]),rec=REC_MAP[m];
    document.getElementById('newExName').value=r[2].charAt(0).toUpperCase()+r[2].slice(1);
    document.getElementById('newExLoadLabel').value=L.loadLabel;document.getElementById('newExInc').value=L.inc;document.getElementById('newExStep').value=L.step;
    document.getElementById('newExUnit').value=r[3]==='cardio'||/plank|bridge v|side bridge|walk/.test(r[2])?(/walk/.test(r[2])?'m':'s'):'reps';
    document.getElementById('newExRegion').value=rec&&PAT_REGION[rec[1]]?PAT_REGION[rec[1]]:'';
    document.getElementById('pkcur_new').scrollIntoView({block:'start',behavior:'smooth'});
  }
  else if(a==='clearMedia'){const ex=profile.exercises[b.dataset.id];ex.media=null;ex.mediaNote='';save();toast('Gambar dilepas.');render()}
  else if(a==='t-add'){T.end=Math.max(T.end,Date.now())+15000;T.total+=15;T.alerted=false;document.getElementById('timer').classList.remove('done');tick()}
  else if(a==='t-stop')stopTimer();
  else if(a==='export')doExport();
  else if(a==='import')document.getElementById('importFile').click();
  else if(a==='saveSet'){db.wake=document.getElementById('wakeIn').checked;save();applyWake();toast('Pengaturan disimpan.');render()}
  else if(a==='saveProfileSet'){
    const c=num(document.getElementById('ceil').value);if(c>0)profile.ceiling=c;
    profile.painTracking=document.getElementById('painIn2').checked;save();toast('Pengaturan profil disimpan.');render()}
  else if(a==='testBeep'){audioUnlock();beep()}
  else if(a==='reset'){if(confirm('Hapus SEMUA data (semua profil, gerakan, dan riwayat)?')&&confirm('Yakin? Data yang belum dicadangkan akan hilang permanen.')){db=blank();ui.profileId=db.activeProfile;ui.sess=defSess(curProfile(),ui.date);save();render()}}
  /* ---- Program: profil ---- */
  else if(a==='addProfile'){
    const name=document.getElementById('newProfName').value.trim();
    if(!name){toast('Isi nama profil dulu.');return}
    const tmpl=document.getElementById('newProfTemplate').value;
    const id=uid('p');
    const p=tmpl==='blank'?blankProfile(id,name):Object.assign(clone(db.profiles[tmpl]),{id,name});
    db.profiles[id]=p;ui.profileId=id;db.activeProfile=id;save();toast('Profil ditambahkan.');render();
  }
  else if(a==='renameProfile'){
    const id=b.dataset.id,name=document.getElementById('pn_'+id).value.trim();
    if(!name){toast('Nama tidak boleh kosong.');return}
    if(Object.values(db.profiles).some(p=>p.id!==id&&p.name.toLowerCase()===name.toLowerCase())){toast('Nama itu sudah dipakai profil lain.');return}
    db.profiles[id].name=name;save();toast('Nama profil diubah.');render();
  }
  else if(a==='delProfile'){
    const id=b.dataset.id;if(Object.keys(db.profiles).length<=1)return;
    if(!confirm(`Hapus profil "${db.profiles[id].name}" beserta seluruh riwayat latihannya? Tidak bisa dibatalkan.`))return;
    delete db.profiles[id];db.logs=db.logs.filter(l=>l.profileId!==id);
    if(ui.profileId===id){ui.profileId=Object.keys(db.profiles)[0];db.activeProfile=ui.profileId}
    save();toast('Profil dihapus.');render();
  }
  /* ---- Program: gerakan ---- */
  else if(a==='addExercise'){
    const name=document.getElementById('newExName').value.trim();
    if(!name){toast('Isi nama gerakan dulu.');return}
    const id=uid('ex');
    profile.exercises[id]={name,unit:document.getElementById('newExUnit').value,loadLabel:document.getElementById('newExLoadLabel').value.trim()||'kg',
      inc:num(document.getElementById('newExInc').value),step:num(document.getElementById('newExStep').value)||1,
      cue:ui.newExMedia?[REC_MAP[ui.newExMedia]?REC_MAP[ui.newExMedia][2]:'',warnFor(CATMAP[ui.newExMedia],profile)].filter(Boolean).join(' '):'',
      media:ui.newExMedia||null,region:document.getElementById('newExRegion').value||''};
    ui.newExMedia=null;
    save();toast('Gerakan ditambahkan.');render();
  }
  else if(a==='saveExercise'){
    const id=b.dataset.id,box=b.closest('details');
    const f=readForm(box);
    profile.exercises[id]=Object.assign(profile.exercises[id],f);
    save();toast('Gerakan disimpan.');render();
  }
  else if(a==='delExercise'){
    const id=b.dataset.id;
    if(!confirm('Hapus gerakan ini? Gerakan akan hilang dari semua sesi yang memakainya (catatan lama tetap tersimpan di riwayat).'))return;
    delete profile.exercises[id];
    Object.values(profile.plan).forEach(ph=>Object.values(ph).forEach(s=>{s.items=s.items.filter(x=>x.exId!==id)}));
    save();toast('Gerakan dihapus.');render();
  }
  /* ---- Program: sesi & jadwal ---- */
  else if(a==='addSessType'){
    const label=document.getElementById('newSessLabel').value.trim();
    if(!label){toast('Isi nama sesi dulu.');return}
    let key=label.trim().charAt(0).toUpperCase();
    if(profile.sessionTypes.some(s=>s.key===key))key=key+(profile.sessionTypes.length+1);
    profile.sessionTypes.push({key,label});
    Object.keys(profile.plan).forEach(ph=>{if(!profile.plan[ph][key])profile.plan[ph][key]={note:'',items:[]}});
    save();toast('Jenis sesi ditambahkan.');render();
  }
  else if(a==='delSessType'){
    if(profile.sessionTypes.length<=1)return;
    const key=b.dataset.key;
    if(!confirm('Hapus jenis sesi ini dari jadwal dan susunan program?'))return;
    profile.sessionTypes=profile.sessionTypes.filter(s=>s.key!==key);
    Object.keys(profile.schedule.days).forEach(d=>{if(profile.schedule.days[d]===key)delete profile.schedule.days[d]});
    Object.keys(profile.plan).forEach(ph=>{delete profile.plan[ph][key]});
    save();toast('Jenis sesi dihapus.');render();
  }
  /* ---- Program: fase ---- */
  else if(a==='saveStartDate'){profile.startDate=document.getElementById('startDateIn').value||profile.startDate;save();toast('Tanggal mulai disimpan.');render()}
  else if(a==='savePhase'){
    const key=b.dataset.key,box=b.closest('.miniform');
    const ph=profile.phases.find(p=>p.key===key);
    ph.name=box.querySelector('[data-f=name]').value.trim()||ph.name;
    const untilEl=box.querySelector('[data-f=until]');
    if(untilEl&&untilEl.value)ph.until=untilEl.value;
    save();toast('Fase disimpan.');render();
  }
  else if(a==='addPhase'){
    const name=document.getElementById('newPhaseName').value.trim();
    const until=document.getElementById('newPhaseUntil').value;
    if(!name||!until){toast('Isi nama fase dan tanggal batas fase sebelumnya.');return}
    const key=uid('F').slice(0,10);
    const last=profile.phases[profile.phases.length-1];
    const prevUntil=profile.phases.length>1?profile.phases[profile.phases.length-2].until:profile.startDate;
    profile.phases.splice(profile.phases.length-1,0,{key,name,until});
    profile.plan[key]={};profile.sessionTypes.forEach(st=>{profile.plan[key][st.key]={note:'',items:[]}});
    save();toast('Fase ditambahkan.');render();
  }
  else if(a==='delPhase'){
    if(profile.phases.length<=1)return;
    const key=b.dataset.key;
    if(!confirm('Hapus fase ini beserta susunan programnya?'))return;
    profile.phases=profile.phases.filter(p=>p.key!==key);delete profile.plan[key];
    save();toast('Fase dihapus.');render();
  }
  else if(a==='movePhase'){
    const key=b.dataset.key,dir=+b.dataset.dir;
    const i=profile.phases.findIndex(p=>p.key===key);
    const j=i+dir;
    if(j<0||j>=profile.phases.length-1)return;
    [profile.phases[i],profile.phases[j]]=[profile.phases[j],profile.phases[i]];
    save();render();
  }
  /* ---- Program: susunan sesi ---- */
  else if(a==='savePlanNote'){
    const p=profile.plan[ui.editPhase][ui.editSess];p.note=document.getElementById('planNoteIn').value;
    save();toast('Catatan sesi disimpan.');render();
  }
  else if(a==='addPlanItem'){
    const exId=document.getElementById('planAddEx').value;
    const p=profile.plan[ui.editPhase][ui.editSess];
    p.items.push({exId,sets:Math.max(1,Math.round(num(document.getElementById('planAddSets').value))||1),
      lo:Math.round(num(document.getElementById('planAddLo').value))||1,hi:Math.round(num(document.getElementById('planAddHi').value))||1,
      rest:Math.round(num(document.getElementById('planAddRest').value))||60,note:''});
    save();toast('Gerakan ditambahkan ke sesi.');render();
  }
  else if(a==='delPlanItem'){
    const p=profile.plan[ui.editPhase][ui.editSess];p.items.splice(+b.dataset.i,1);save();render();
  }
  else if(a==='movePlanItem'){
    const p=profile.plan[ui.editPhase][ui.editSess],i=+b.dataset.i,dir=+b.dataset.dir,j=i+dir;
    if(j<0||j>=p.items.length)return;
    [p.items[i],p.items[j]]=[p.items[j],p.items[i]];save();render();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='painIn'){document.getElementById('painOut').textContent=t.value;return}
  if(t.dataset&&t.dataset.pick){fillPicker(t.dataset.pick);return}
  if(t.dataset&&t.dataset.browse){ui.brQ=document.getElementById('brQ').value;ui.brBp=document.getElementById('brBp').value;ui.brN=24;document.getElementById('brList').innerHTML=browseList(curProfile());return}
  if(t.dataset&&t.dataset.kind){const exId=t.id.slice(2),key=ui.date+ui.profileId+ui.sess+exId;drafts[key]=drafts[key]||{};drafts[key][t.dataset.kind]=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dateIn'&&t.value){ui.date=t.value;ui.sess=defSess(curProfile(),ui.date);render()}
  else if(t.dataset.action==='progEx'){ui.progEx=t.value;render()}
  else if(t.dataset.action==='painEdit'){const l=db.logs.find(x=>x.id===t.dataset.id);l[t.dataset.f]=t.value===''?null:+t.value;save();toast('Skor nyeri diperbarui.')}
  else if(t.dataset.action==='dayMap'){const profile=curProfile();const d=t.dataset.day;if(t.value)profile.schedule.days[d]=t.value;else delete profile.schedule.days[d];save();toast('Jadwal disimpan.')}
  else if(t.dataset.pickbp!==undefined){fillPicker(t.dataset.pickbp)}
  else if(t.dataset.action==='planPhase'){ui.editPhase=t.value;render()}
  else if(t.dataset.action==='planSess'){ui.editSess=t.value;render()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sub){ui.subs=ui.subs||{};ui.subs[d.dataset.sub]=d.open}},true);
function doExport(){
  db.lastExport=new Date().toISOString();save();
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='log-latihan-'+today()+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Cadangan diunduh.');render();
}
document.getElementById('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const raw=JSON.parse(await f.text());
    let d;
    if(raw&&raw.version===2&&raw.profiles&&Array.isArray(raw.logs))d=raw;
    else if(raw&&raw.version===1&&Array.isArray(raw.sessions))d=migrateV1(raw);
    else throw new Error('Format file tidak dikenali.');
    if(!confirm(`Pulihkan cadangan ini (${d.logs.length} sesi, ${Object.keys(d.profiles).length} profil)? Data di HP ini sekarang akan diganti.`))return;
    upgrade(d);
    db=d;if(!db.profiles[db.activeProfile])db.activeProfile=Object.keys(db.profiles)[0];
    ui.profileId=db.activeProfile;ui.sess=defSess(curProfile(),ui.date);ui.progEx=null;
    save();toast('Data dipulihkan.');render();
  }catch(err){alert('Gagal memulihkan: '+err.message)}
});

render();applyWake();
</script>
</body>
