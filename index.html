<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2233">
<title>Log Latihan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F0; --card:#FFFFFF; --ink:#1B2233; --soft:#5B6475; --line:#D3D9D7;
  --plate:#C62839; --plate-ink:#FFFFFF; --mat:#2F4A7A; --ok:#2E7D5B; --warn:#A8651A;
  --num:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --txt:'Barlow','Roboto',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#121821;--card:#1B2330;--ink:#E7EBEF;--soft:#98A2B3;--line:#2B3546;
  --plate:#E0485A;--mat:#86A7E3;--ok:#5CB88E;--warn:#E0A75A;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--txt);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mat);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 120px}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
h1{font-family:var(--num);font-weight:700;font-size:1.7rem;white-space:nowrap;letter-spacing:.01em;margin:0;line-height:1}
h2{font-family:var(--num);font-weight:700;font-size:1.35rem;margin:0 0 4px;line-height:1.1}
.muted{color:var(--soft);font-size:.9rem}
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;font-family:var(--num);font-weight:700;font-size:1.15rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.person{margin-top:10px}
.person button[aria-pressed="true"]{background:var(--plate);color:var(--plate-ink)}
.meta{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta input[type=date]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px}
.chip{font-family:var(--num);font-weight:600;font-size:.95rem;text-align:right;line-height:1.15;padding:3px 9px;border-radius:999px;background:var(--mat);color:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.ex-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.target{font-family:var(--num);font-weight:600;font-size:1.05rem;color:var(--mat);white-space:nowrap}
.cue{font-size:.88rem;color:var(--soft);margin:2px 0 8px}
.sug{border-left:4px solid var(--plate);padding:6px 10px;margin:8px 0;background:color-mix(in srgb,var(--plate) 7%,transparent);border-radius:0 8px 8px 0;font-size:.93rem}
.sug.hold{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.last{font-size:.88rem;color:var(--soft)}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.set{font-family:var(--num);font-weight:600;font-size:1.05rem;border:1.5px solid var(--ink);border-radius:8px;padding:2px 4px 2px 8px;display:flex;align-items:center;gap:4px}
.set.over{border-color:var(--warn);color:var(--warn)}
.set button{border:0;background:transparent;color:var(--soft);font-size:1rem;padding:2px 6px;border-radius:6px}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.stepper label{display:block;font-size:.8rem;color:var(--soft);margin-bottom:2px}
.stepper .ctl{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.stepper button{width:42px;border:0;background:transparent;font-size:1.4rem;font-weight:600}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--num);font-weight:700;font-size:1.7rem;padding:4px 0}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:600;background:var(--ink);color:var(--paper);width:100%}
.btn.plate{background:var(--plate);color:var(--plate-ink);font-family:var(--num);font-size:1.25rem;letter-spacing:.02em;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:.9rem}
.btn.danger{background:transparent;border:1.5px solid var(--plate);color:var(--plate)}
.note{font-size:.88rem;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--warn);color:var(--ink);margin:10px 0}
.note b{color:var(--warn)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;padding:12px 4px 14px;font-family:var(--num);font-weight:600;font-size:1.1rem;color:var(--soft);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--plate)}
#timer{position:fixed;left:0;right:0;bottom:62px;z-index:7;display:none;justify-content:center;padding:0 12px}
#timer .in{max-width:560px;width:100%;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#timer .clock{font-family:var(--num);font-weight:700;font-size:2.2rem;min-width:88px;text-align:center;line-height:1}
#timer .lbl{flex:1;font-size:.85rem;line-height:1.25}
#timer .bar{height:4px;background:color-mix(in srgb,var(--paper) 25%,transparent);border-radius:4px;margin-top:6px;overflow:hidden}
#timer .bar i{display:block;height:100%;background:var(--plate)}
#timer button{border:0;border-radius:8px;background:color-mix(in srgb,var(--paper) 15%,transparent);color:var(--paper);padding:8px 9px;font-weight:600}
#timer.done .in{background:var(--plate)}
.pain input[type=range]{width:100%;accent-color:var(--plate)}
.painval{font-family:var(--num);font-weight:700;font-size:2rem}
.hist-item summary{list-style:none;cursor:pointer}
.hist-item summary::-webkit-details-marker{display:none}
.hist-item .sum{display:flex;justify-content:space-between;gap:8px}
.hist-ex{margin:8px 0;font-size:.93rem}
.hist-ex b{font-weight:600}
select{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;width:100%}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font-family:var(--num);fill:var(--soft);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:600;color:var(--soft)}
.big{font-family:var(--num);font-weight:700;font-size:1.6rem}
.field{margin:10px 0}
.field label{display:block;font-size:.85rem;color:var(--soft);margin-bottom:3px}
.field input[type=text],.field input[type=number]{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;z-index:9;font-size:.92rem;display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="topbar"></div></header>
<main class="wrap" id="view"></main>
<div id="timer" role="status" aria-live="polite"><div class="in">
  <div class="clock" id="tclock">0:00</div>
  <div class="lbl"><div id="tlabel">Istirahat</div><div class="bar"><i id="tbar" style="width:0"></i></div></div>
  <button data-action="t-add" aria-label="Tambah 15 detik">+15</button>
  <button data-action="t-stop">Tutup</button>
</div></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ================= Rencana (sama dengan dokumen rencana) ================= */
const PLAN_START='2026-09-22', TECH_END='2026-10-06', PROJ_FROM='2026-10-06';
const PHASES=[
  {key:'F1',name:'Fase 1 · Belajar gerak',until:'2026-11-03'},
  {key:'F2',name:'Fase 2 · Transisi',until:'2026-12-15'},
  {key:'F3',name:'Fase 3 · Simulasi rumah',until:'2027-01-12'},
  {key:'R', name:'Home gym',until:'9999-12-31'}
];
// type: db2 = kg per dumbbell (sepasang), db1 = satu dumbbell, kb = kettlebell, machine = angka di mesin, bw = beban tubuh (+beban tambahan)
const EX={
  goblet:{name:'Goblet squat ke bench',type:'db1',unit:'reps',knee:true,cue:'Turun sampai duduk menyentuh bench, lalu berdiri. AnNie: boleh diganti seated leg press di minggu 1–2.'},
  rdl:{name:'Romanian deadlift (dumbbell)',type:'db2',unit:'reps',cue:'Pinggul mendorong ke belakang, punggung lurus, lutut sedikit tekuk dan tetap.'},
  chestm:{name:'Chest press (mesin plate-loaded)',type:'machine',unit:'reps',cue:'Beban = angka total pelat di mesin.'},
  pulldown:{name:'Lat pulldown',type:'machine',unit:'reps',cue:'Tarik ke dada atas, bahu turun.'},
  hipabd:{name:'Hip abduction (mesin)',type:'machine',unit:'reps',cue:'Prioritas untuk AnNie: penguatan pinggul membantu lutut.'},
  farmer_m:{name:'Farmer’s carry',type:'db2',unit:'m',cue:'Dumbbell di kedua tangan, jalan tegak.'},
  split:{name:'Split squat statis',type:'db2',unit:'reps',knee:true,perSide:true,cue:'Kaki depan-belakang, tidak melangkah. Pegangan bila perlu. AnNie mulai tanpa beban (isi 0).'},
  thrust:{name:'Hip thrust / glute bridge di bench',type:'db1',unit:'reps',cue:'Dumbbell di pinggul, dorong sampai pinggul lurus.'},
  ohp:{name:'Shoulder press duduk (dumbbell)',type:'db2',unit:'reps',cue:'Sandaran bench tegak.'},
  row1:{name:'One-arm dumbbell row',type:'db1',unit:'reps',perSide:true,cue:'Satu tangan dan lutut di bench.'},
  legcurl:{name:'Leg curl (mesin)',type:'machine',unit:'reps',cue:''},
  suitcase_m:{name:'Suitcase carry',type:'db1',unit:'m',perSide:true,cue:'Satu tangan, badan tetap tegak.'},
  bench:{name:'Dumbbell bench press',type:'db2',unit:'reps',cue:'Bench datar atau sedikit incline.'},
  csrow:{name:'Chest-supported row',type:'db2',unit:'reps',cue:'Dada ditopang bench incline.'},
  kbdl:{name:'Kettlebell deadlift',type:'kb',unit:'reps',cue:'Kettlebell di antara kaki, dorong lantai.'},
  sideabd:{name:'Side-lying hip abduction / clamshell',type:'bw',unit:'reps',perSide:true,cue:'Tanpa alat.'},
  farmer_s:{name:'Farmer’s carry',type:'db2',unit:'s',cue:'Bolak-balik di ruangan.'},
  suitcase_s:{name:'Suitcase carry',type:'db1',unit:'s',perSide:true,cue:'Satu tangan, badan tetap tegak.'},
  plank:{name:'Plank / dead bug',type:'bw',unit:'s',cue:'Dead bug: hitung detik total per set.'}
};
// rx(sets, [lo,hi] JuAn, [lo,hi] AnNie, istirahat JuAn, istirahat AnNie, only)
const rx=(id,sets,t,i,rt=90,ri=90,only)=>({id,sets,range:{tyo:t,istri:i},rest:{tyo:rt,istri:ri},only});
const UP=[8,15]; // aturan tubuh atas AnNie
const HOME_A=[rx('goblet',3,[8,10],[8,10],90,120),rx('rdl',3,[8,10],[8,10]),rx('bench',3,[8,12],UP),rx('csrow',3,[10,12],UP),rx('sideabd',2,[12,15],[12,15],45,45),rx('farmer_s',3,[30,40],[30,40],60,60)];
const HOME_B=[rx('split',3,[6,10],[6,10],90,120),rx('thrust',3,[10,12],[10,12],90,90,'tyo'),rx('kbdl',3,[8,12],[8,12],90,90,'istri'),rx('ohp',3,[8,10],UP),rx('row1',3,[8,12],UP),rx('plank',2,[30,45],[30,45],45,45),rx('suitcase_s',2,[30,40],[30,40],60,60)];
const PLAN={
  F1:{A:[rx('goblet',3,[8,10],[8,10],90,120),rx('rdl',3,[8,10],[8,10]),rx('chestm',3,[8,12],UP),rx('pulldown',3,[10,12],UP),rx('hipabd',2,[12,15],[12,15],60,60),rx('farmer_m',3,[20,30],[20,30],60,60)],
      B:[rx('split',3,[6,10],[6,10],90,120),rx('thrust',3,[10,12],[10,12]),rx('ohp',3,[8,10],UP),rx('row1',3,[8,12],UP),rx('legcurl',2,[10,15],[10,15],60,60),rx('suitcase_m',2,[20,30],[20,30],60,60)]},
  F2:{A:[rx('goblet',3,[8,10],[8,10],90,120),rx('rdl',3,[8,10],[8,10]),rx('bench',3,[8,12],UP),rx('pulldown',3,[10,12],UP),rx('csrow',3,[10,12],UP),rx('hipabd',2,[12,15],[12,15],60,60),rx('farmer_m',3,[20,30],[20,30],60,60)],
      B:[rx('split',3,[6,10],[6,10],90,120),rx('kbdl',3,[8,12],[8,12]),rx('ohp',3,[8,10],UP),rx('row1',3,[8,12],UP),rx('suitcase_m',2,[20,30],[20,30],60,60)]},
  F3:{A:HOME_A,B:HOME_B},
  R:{A:HOME_A,B:HOME_B}
};
const INC={db1:2.5,db2:2.5,kb:4,machine:2.5,bw:0};
const STEP={db1:1,db2:1,kb:2,machine:2.5,bw:1};
const UNIT={reps:'rep',m:'m',s:'dtk'};
const LOAD_LABEL={db2:'kg / dumbbell',db1:'kg',kb:'kg',machine:'kg (mesin)',bw:'kg tambahan'};

/* ================= Penyimpanan ================= */
const KEY='logLatihan.v1';
const blank=()=>({version:1,names:{tyo:'JuAn',istri:'AnNie'},ceiling:30,wake:true,lastExport:null,sessions:[]});
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){db=blank()}
db=Object.assign(blank(),db);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Gagal menyimpan: penyimpanan browser penuh atau diblokir.')}}

/* ================= Utilitas tanggal ================= */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmt=s=>pd(s).toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtShort=s=>pd(s).toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const phaseOf=s=>PHASES.find(p=>s<p.until);
const weekOf=s=>Math.floor(dayDiff(PLAN_START,s)/7)+1;
const defSess=s=>{const w=pd(s).getDay();return w===4?'B':'A'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const kg=n=>(Math.round(n*100)/100).toString().replace('.',',');

/* ================= State UI ================= */
const ui={tab:'log',date:today(),person:'tyo',sess:null,progPerson:'tyo',progEx:null};
ui.sess=defSess(ui.date);
const drafts={}; // nilai input sementara per kartu

function findSession(date,person,sess){return db.sessions.find(s=>s.date===date&&s.person===person&&s.sess===sess)}
function getOrCreate(date,person,sess){
  let s=findSession(date,person,sess);
  if(!s){s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date,person,sess,phase:phaseOf(date).key,entries:{},painDuring:null,painNextDay:null};db.sessions.push(s)}
  return s;
}
function planFor(date,sess,person){
  const s=findSession(date,person,sess);
  const ph=s?s.phase:phaseOf(date).key;
  return PLAN[ph][sess].filter(it=>!it.only||it.only===person);
}
function lastEntry(person,exId,beforeDate){
  const list=db.sessions.filter(s=>s.person===person&&s.date<beforeDate&&s.entries[exId]&&s.entries[exId].length).sort((a,b)=>a.date<b.date?1:-1);
  return list.length?{date:list[0].date,sets:list[0].entries[exId]}:null;
}
function lastIstriPain(beforeDate){
  const l=db.sessions.filter(s=>s.person==='istri'&&s.date<beforeDate&&(s.painDuring!=null||s.painNextDay!=null)).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(!l)return null;
  return Math.max(l.painDuring??0,l.painNextDay??0);
}

/* ================= Progresi ganda ================= */
function suggest(it,person,date){
  const ex=EX[it.id],[lo,hi]=it.range[person],last=lastEntry(person,it.id,date),inc=INC[ex.type];
  if(!last)return{w:null,r:lo,hold:false,text:`Belum ada catatan. Cari beban yang terasa berat tapi rapi di ${lo} ${UNIT[ex.unit]}, sisakan tenaga 2–3 ${UNIT[ex.unit]}.`};
  const top=Math.max(...last.sets.map(s=>s.w));
  const atTop=last.sets.filter(s=>s.w===top);
  const best=Math.max(...atTop.map(s=>s.r));
  if(date<TECH_END)return{w:top,r:lo,hold:true,text:`Minggu teknik (s.d. ${fmtShort('2026-10-05')}): fokus gerakan rapi. Sesuaikan beban sampai ${lo}–${hi} ${UNIT[ex.unit]} terasa berat tapi rapi.`};
  if(person==='istri'&&ex.knee){const p=lastIstriPain(date);if(p!=null&&p>3)return{w:top,r:lo,hold:true,text:`Nyeri lutut sesi terakhir ${p}/10 (di atas 3). Jangan naikkan beban; kurangi beban atau rentang gerak bila perlu.`}}
  const full=atTop.length>=it.sets&&atTop.slice(0,it.sets).every(s=>s.r>=hi);
  if(full){
    if(ex.type==='bw')return{w:top,r:lo,hold:false,text:`Semua set mencapai ${hi} ${UNIT[ex.unit]}. Tambah sedikit beban atau pilih variasi yang lebih sulit.`};
    if(ex.type==='kb')return{w:top,r:hi,hold:false,text:`Semua set mencapai ${hi}. Kettlebell sudah terlalu ringan untuk gerakan ini: ganti ke dumbbell atau kettlebell lebih berat.`};
    return{w:top+inc,r:lo,hold:false,text:`Semua set mencapai ${hi} ${UNIT[ex.unit]}. Naikkan ke ${kg(top+inc)} kg, mulai lagi dari ${lo} ${UNIT[ex.unit]}.`};
  }
  const nr=Math.min(hi,best+(ex.unit==='reps'?1:5));
  return{w:top,r:nr,hold:false,text:`Beban tetap ${kg(top)} kg. Target: tambah ${ex.unit==='reps'?'1 repetisi':'5 '+UNIT[ex.unit]} sampai semua set mencapai ${hi}.`};
}

/* ================= Timer istirahat ================= */
const T={end:0,total:0,alerted:true,iv:null,label:''};
let actx=null;
function audioUnlock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  try{audioUnlock();const t0=actx.currentTime;[0,.35,.7].forEach(o=>{const g=actx.createGain(),osc=actx.createOscillator();osc.type='square';osc.frequency.value=880;g.gain.setValueAtTime(.0001,t0+o);g.gain.exponentialRampToValueAtTime(.35,t0+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+o+.25);osc.connect(g).connect(actx.destination);osc.start(t0+o);osc.stop(t0+o+.27)})}catch(e){}
  if(navigator.vibrate)navigator.vibrate([400,150,400,150,400]);
}
function startTimer(sec,label){T.end=Date.now()+sec*1000;T.total=sec;T.alerted=false;T.label=label;document.getElementById('timer').style.display='flex';document.getElementById('timer').classList.remove('done');tick();clearInterval(T.iv);T.iv=setInterval(tick,250)}
function tick(){
  const left=Math.max(0,Math.round((T.end-Date.now())/1000));
  document.getElementById('tclock').textContent=Math.floor(left/60)+':'+pad(left%60);
  document.getElementById('tlabel').textContent=left>0?'Istirahat · '+T.label:'Waktunya set berikutnya';
  document.getElementById('tbar').style.width=(T.total?100*(1-left/T.total):100)+'%';
  if(left===0&&!T.alerted&&document.visibilityState==='visible'){T.alerted=true;document.getElementById('timer').classList.add('done');beep()}
}
function stopTimer(){clearInterval(T.iv);T.alerted=true;document.getElementById('timer').style.display='none'}

/* ================= Layar tetap menyala ================= */
let wakeLock=null;
async function applyWake(){
  try{
    if(db.wake&&'wakeLock' in navigator&&document.visibilityState==='visible'){if(!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}
    else if(wakeLock){await wakeLock.release();wakeLock=null}
  }catch(e){wakeLock=null}
}
document.addEventListener('visibilitychange',()=>{applyWake();if(document.visibilityState==='visible')tick()});

/* ================= Render ================= */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function render(){renderTop();renderTabs();({log:renderLog,hist:renderHist,prog:renderProg,data:renderData})[ui.tab]()}
function renderTabs(){
  const t=[['log','Latihan'],['hist','Riwayat'],['prog','Progres'],['data','Data']];
  document.getElementById('tabs').innerHTML=t.map(([k,n])=>`<button data-action="tab" data-v="${k}" ${ui.tab===k?'aria-current="page"':''}>${n}</button>`).join('');
}
function renderTop(){
  const el=document.getElementById('topbar');
  if(ui.tab!=='log'){el.innerHTML=`<h1>${{hist:'Riwayat',prog:'Progres',data:'Data & cadangan'}[ui.tab]}</h1>`;return}
  const ph=phaseOf(ui.date),w=weekOf(ui.date);
  el.innerHTML=`<div class="row between"><h1>Log Latihan</h1><span class="chip">${esc(ph.name)}${w>=1?`<br>minggu ${w}`:''}</span></div>
  <div class="seg person" role="group" aria-label="Siapa yang latihan">
    ${['tyo','istri'].map(p=>`<button data-action="person" data-v="${p}" aria-pressed="${ui.person===p}">${esc(db.names[p])}</button>`).join('')}
  </div>
  <div class="meta">
    <input type="date" id="dateIn" value="${ui.date}" aria-label="Tanggal latihan">
    <div class="seg" role="group" aria-label="Sesi" style="flex:0 0 auto">
      ${['A','B'].map(s=>`<button data-action="sess" data-v="${s}" aria-pressed="${ui.sess===s}" style="padding:6px 14px;white-space:nowrap">Sesi ${s}</button>`).join('')}
    </div>
  </div>`;
}
function stepper(id,label,val,step,kind){
  return `<div class="stepper"><label for="${id}">${label}</label><div class="ctl">
  <button data-action="step" data-t="${id}" data-d="-${step}" aria-label="Kurangi">−</button>
  <input id="${id}" inputmode="decimal" value="${val??''}" data-kind="${kind}" aria-label="${label}">
  <button data-action="step" data-t="${id}" data-d="${step}" aria-label="Tambah">+</button></div></div>`;
}
function renderLog(){
  const v=document.getElementById('view');
  const items=planFor(ui.date,ui.sess,ui.person);
  const s=findSession(ui.date,ui.person,ui.sess);
  let h='';
  // pengingat cadangan
  const nSess=db.sessions.length;
  if(nSess>0&&(!db.lastExport||dayDiff(db.lastExport.slice(0,10),today())>7))
    h+=`<div class="note"><b>Cadangan:</b> ${db.lastExport?'terakhir '+fmt(db.lastExport.slice(0,10)):'belum pernah dibuat'}. Data hanya tersimpan di browser HP ini. <button class="btn small ghost" data-action="export" style="margin-top:6px">Unduh cadangan sekarang</button></div>`;
  // pengingat nyeri keesokan hari
  if(ui.person==='istri'){
    const miss=db.sessions.filter(x=>x.person==='istri'&&x.date<ui.date&&x.painNextDay==null&&Object.keys(x.entries).length).sort((a,b)=>a.date<b.date?1:-1)[0];
    if(miss)h+=`<div class="note"><b>Nyeri keesokan hari</b> untuk sesi ${fmt(miss.date)} belum diisi.
      <div class="row" style="margin-top:6px"><select id="missPain" aria-label="Skor nyeri keesokan hari">${Array.from({length:11},(_,i)=>`<option value="${i}">${i}</option>`).join('')}</select>
      <button class="btn small" data-action="missPain" data-id="${miss.id}">Simpan</button></div></div>`;
  }
  if(ui.sess!==defSess(ui.date)&&[2,4].includes(pd(ui.date).getDay()))h+=`<p class="muted">Jadwal hari ini Sesi ${defSess(ui.date)}. Anda sedang melihat Sesi ${ui.sess}.</p>`;
  items.forEach((it,idx)=>{
    const ex=EX[it.id],[lo,hi]=it.range[ui.person],sug=suggest(it,ui.person,ui.date);
    const logged=s&&s.entries[it.id]?s.entries[it.id]:[];
    const last=lastEntry(ui.person,it.id,ui.date);
    const key=ui.date+ui.person+ui.sess+it.id;
    const d=drafts[key]||{};
    const wv=d.w??(logged.length?logged[logged.length-1].w:(sug.w??''));
    const rv=d.r??(logged.length?logged[logged.length-1].r:sug.r);
    const cap=ui.person==='istri'&&ex.knee?10:null;
    h+=`<section class="card" aria-labelledby="t${idx}">
      <div class="ex-title"><h2 id="t${idx}">${esc(ex.name)}</h2><span class="target">${it.sets} × ${lo}–${hi} ${UNIT[ex.unit]}${ex.perSide?'/sisi':''}</span></div>
      ${ex.cue?`<p class="cue">${esc(ex.cue)}</p>`:''}
      ${last?`<div class="last">Terakhir (${fmtShort(last.date)}): ${last.sets.map(x=>kg(x.w)+'×'+x.r).join(', ')}</div>`:''}
      <div class="sug ${sug.hold?'hold':''}">${esc(sug.text)}</div>
      ${logged.length?`<div class="sets">${logged.map((x,i)=>`<span class="set ${cap&&x.r>cap?'over':''}">${i+1}: ${kg(x.w)} kg × ${x.r}<button data-action="delset" data-ex="${it.id}" data-i="${i}" aria-label="Hapus set ${i+1}">×</button></span>`).join('')}</div>`:''}
      ${cap&&logged.some(x=>x.r>cap)?`<p class="cue" style="color:var(--warn)">Aturan lutut: maksimal ${cap} repetisi per set untuk gerakan ini.</p>`:''}
      <div class="entry">
        ${stepper('w_'+it.id,LOAD_LABEL[ex.type],wv,STEP[ex.type],'w')}
        ${stepper('r_'+it.id,ex.unit==='reps'?'Repetisi':(ex.unit==='m'?'Jarak (m)':'Waktu (detik)'),rv,ex.unit==='reps'?1:5,'r')}
      </div>
      <button class="btn plate" data-action="logset" data-ex="${it.id}" data-rest="${it.rest[ui.person]}">${logged.length>=it.sets?'Catat set tambahan':'Catat set '+(logged.length+1)+' dari '+it.sets}</button>
    </section>`;
  });
  if(ui.person==='istri'){
    const pv=s&&s.painDuring!=null?s.painDuring:0;
    h+=`<section class="card pain"><h2>Nyeri lutut kiri saat latihan</h2>
      <p class="cue">0 = tidak nyeri, 10 = sangat nyeri. Di atas 3 = sesi berikutnya jangan naikkan beban squat/lunge.</p>
      <div class="row"><input type="range" min="0" max="10" step="1" id="painIn" value="${pv}" aria-label="Skor nyeri saat latihan"><span class="painval" id="painOut">${s&&s.painDuring!=null?pv:'–'}</span></div>
      <button class="btn ghost" data-action="savepain" style="margin-top:8px">Simpan skor nyeri</button></section>`;
  }
  v.innerHTML=h;
}
function renderHist(){
  const v=document.getElementById('view');
  const list=db.sessions.filter(s=>Object.keys(s.entries).length||s.painDuring!=null).sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
  if(!list.length){v.innerHTML=`<div class="card"><h2>Belum ada sesi</h2><p class="muted">Catat set pertama di tab Latihan. Sesi akan muncul di sini.</p></div>`;return}
  v.innerHTML=list.map(s=>{
    const exs=Object.entries(s.entries).filter(([,a])=>a.length);
    const pain=s.person==='istri'?`<div class="row" style="margin-top:8px;gap:12px;flex-wrap:wrap">
      <label class="muted">Nyeri saat latihan <select data-action="painEdit" data-id="${s.id}" data-f="painDuring" style="width:auto">${painOpts(s.painDuring)}</select></label>
      <label class="muted">Keesokan hari <select data-action="painEdit" data-id="${s.id}" data-f="painNextDay" style="width:auto">${painOpts(s.painNextDay)}</select></label></div>`:'';
    const flag=s.person==='istri'&&Math.max(s.painDuring??0,s.painNextDay??0)>3?' · <span style="color:var(--warn)">nyeri &gt;3</span>':'';
    return `<details class="card hist-item"><summary><div class="sum"><div><h2>${fmt(s.date)}</h2><div class="muted">${esc(db.names[s.person])} · Sesi ${s.sess} · ${esc(PHASES.find(p=>p.key===s.phase).name)}${flag}</div></div><span class="target">${exs.length} gerakan</span></div></summary>
      ${exs.map(([id,a])=>`<div class="hist-ex"><b>${esc(EX[id]?EX[id].name:id)}</b>: ${a.map(x=>kg(x.w)+'×'+x.r).join(', ')}</div>`).join('')}
      ${pain}
      <button class="btn small danger" data-action="delsess" data-id="${s.id}" style="margin-top:10px">Hapus sesi ini</button></details>`;
  }).join('');
}
const painOpts=v=>`<option value="" ${v==null?'selected':''}>–</option>`+Array.from({length:11},(_,i)=>`<option value="${i}" ${v===i?'selected':''}>${i}</option>`).join('');

function seriesFor(person,exId){
  return db.sessions.filter(s=>s.person===person&&s.entries[exId]&&s.entries[exId].length).sort((a,b)=>a.date<b.date?-1:1)
    .map(s=>{const a=s.entries[exId];const top=Math.max(...a.map(x=>x.w));return{date:s.date,top,reps:Math.max(...a.filter(x=>x.w===top).map(x=>x.r)),sets:a}});
}
function projection(pts,ceiling){
  const use=pts.filter(p=>p.date>=PROJ_FROM);
  if(use.length<3)return{ok:false,msg:`Butuh minimal 3 sesi sejak ${fmtShort(PROJ_FROM)} (minggu ke-3). Sekarang: ${use.length}.`};
  const span=dayDiff(use[0].date,use[use.length-1].date);
  if(span<14)return{ok:false,msg:'Data baru mencakup '+span+' hari. Butuh minimal 14 hari agar trennya bermakna.'};
  const xs=use.map(p=>dayDiff(use[0].date,p.date)),ys=use.map(p=>p.top),n=xs.length;
  const mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let sxy=0,sxx=0;xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-my);sxx+=(x-mx)**2});
  const slope=sxx?sxy/sxx:0,icp=my-slope*mx,lastX=xs[n-1],fitNow=icp+slope*lastX,perWeek=slope*7;
  if(fitNow>=ceiling)return{ok:true,perWeek,msg:`Tren sudah di atau melewati ${ceiling} kg.`,reached:true};
  if(slope<=0)return{ok:true,perWeek,msg:'Belum ada tren naik dari data sejauh ini, jadi tanggal mentok belum bisa diproyeksikan.'};
  const days=Math.ceil((ceiling-fitNow)/slope);const d=pd(use[n-1].date);d.setDate(d.getDate()+days);
  return{ok:true,perWeek,date:ds(d),days,msg:''};
}
function chartSVG(pts,ceiling,showCeil){
  if(!pts.length)return'';
  const W=520,H=220,L=36,R=12,T=14,B=28;
  const t0=pd(pts[0].date).getTime(),t1=Math.max(pd(pts[pts.length-1].date).getTime(),t0+864e5);
  let ymax=Math.max(...pts.map(p=>p.top));if(showCeil)ymax=Math.max(ymax,ceiling);ymax=Math.max(5,Math.ceil(ymax/5)*5);
  const X=d=>L+(pd(d).getTime()-t0)/(t1-t0)*(W-L-R),Y=v=>T+(1-v/ymax)*(H-T-B);
  let g='';for(let v=0;v<=ymax;v+=ymax>30?10:5)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  if(showCeil)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(ceiling)}" y2="${Y(ceiling)}" stroke="var(--plate)" stroke-dasharray="5 4"/><text x="${W-R}" y="${Y(ceiling)-5}" text-anchor="end" style="fill:var(--plate)">batas ${ceiling} kg</text>`;
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.date).toFixed(1)+' '+Y(p.top).toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${X(p.date)}" cy="${Y(p.top)}" r="4" fill="var(--mat)"><title>${fmtShort(p.date)}: ${kg(p.top)} kg × ${p.reps}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik beban teratas per sesi">${g}<path d="${path}" fill="none" stroke="var(--mat)" stroke-width="2.5"/>${dots}
  <text x="${L}" y="${H-8}">${fmtShort(pts[0].date)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fmtShort(pts[pts.length-1].date)}</text></svg>`;
}
function renderProg(){
  const v=document.getElementById('view');
  const p=ui.progPerson;
  const ids=Object.keys(EX).filter(id=>seriesFor(p,id).length);
  let h=`<div class="seg" role="group" aria-label="Pilih orang">${['tyo','istri'].map(x=>`<button data-action="progPerson" data-v="${x}" aria-pressed="${p===x}">${esc(db.names[x])}</button>`).join('')}</div>`;
  if(!ids.length){v.innerHTML=h+`<div class="card"><h2>Belum ada data</h2><p class="muted">Grafik muncul setelah ada set yang dicatat untuk ${esc(db.names[p])}.</p></div>`;return}
  if(!ids.includes(ui.progEx))ui.progEx=ids[0];
  const ex=EX[ui.progEx],pts=seriesFor(p,ui.progEx),isDb=ex.type==='db1'||ex.type==='db2';
  h+=`<div class="field"><label for="exSel">Gerakan</label><select id="exSel" data-action="progEx">${ids.map(id=>`<option value="${id}" ${id===ui.progEx?'selected':''}>${esc(EX[id].name)}${EX[id].unit!=='reps'?' ('+UNIT[EX[id].unit]+')':''}</option>`).join('')}</select></div>`;
  h+=`<section class="card"><h2>Beban teratas per sesi</h2><p class="muted">${LOAD_LABEL[ex.type]}</p>${chartSVG(pts,db.ceiling,isDb)}</section>`;
  if(isDb){
    const pr=projection(pts,db.ceiling);
    h+=`<section class="card"><h2>Proyeksi mentok ${db.ceiling} kg</h2>`;
    if(!pr.ok)h+=`<p class="muted">${esc(pr.msg)}</p>`;
    else{
      h+=`<p>Tren kenaikan: <span class="big">${pr.perWeek>0?'+':''}${kg(Math.round(pr.perWeek*100)/100)} kg</span> per minggu</p>`;
      h+=pr.date?`<p>Perkiraan mencapai ${db.ceiling} kg: <span class="big">${fmt(pr.date)}</span> (±${Math.round(pr.days/7)} minggu lagi)</p>`:`<p class="muted">${esc(pr.msg)}</p>`;
      h+=`<p class="cue">Dihitung dengan garis lurus dari data sejak ${fmtShort(PROJ_FROM)}. Kenaikan biasanya melambat seiring waktu, jadi tanggal sebenarnya kemungkinan lebih lambat dari perkiraan ini. Beban gym dan rumah bisa berbeda sedikit.</p>`;
    }
    h+=`</section>`;
  }
  h+=`<section class="card"><h2>Rincian</h2><table><thead><tr><th>Tanggal</th><th>Set</th></tr></thead><tbody>${pts.slice().reverse().map(x=>`<tr><td>${fmtShort(x.date)}</td><td>${x.sets.map(s=>kg(s.w)+'×'+s.r).join(', ')}</td></tr>`).join('')}</tbody></table></section>`;
  v.innerHTML=h;
}
function renderData(){
  const v=document.getElementById('view');
  const n=db.sessions.length;
  v.innerHTML=`<section class="card"><h2>Cadangan</h2>
    <p class="muted">${n} sesi tersimpan di browser HP ini. Cadangan terakhir: ${db.lastExport?fmt(db.lastExport.slice(0,10)):'belum pernah'}.</p>
    <p class="cue">Data bisa hilang kalau data browser dihapus, HP diganti, atau alamat situs berubah. Unduh cadangan minimal seminggu sekali dan simpan di Google Drive.</p>
    <button class="btn" data-action="export">Unduh cadangan (JSON)</button>
    <button class="btn ghost" data-action="import" style="margin-top:8px">Pulihkan dari cadangan</button></section>
  <section class="card"><h2>Pengaturan</h2>
    <div class="field"><label for="nmT">Nama profil 1</label><input type="text" id="nmT" value="${esc(db.names.tyo)}"></div>
    <div class="field"><label for="nmI">Nama profil 2</label><input type="text" id="nmI" value="${esc(db.names.istri)}"></div>
    <div class="field"><label for="ceil">Batas beban untuk proyeksi (kg per dumbbell)</label><input type="number" id="ceil" inputmode="decimal" value="${db.ceiling}"></div>
    <label class="row" style="margin:10px 0"><input type="checkbox" id="wakeIn" ${db.wake?'checked':''}> <span>Layar tetap menyala saat app terbuka (supaya bunyi timer tidak tertahan)</span></label>
    <button class="btn" data-action="saveSet">Simpan pengaturan</button>
    <button class="btn ghost" data-action="testBeep" style="margin-top:8px">Tes bunyi dan getar</button></section>
  <section class="card"><h2>Hapus semua data</h2><p class="cue">Tidak bisa dibatalkan. Unduh cadangan dulu.</p><button class="btn danger" data-action="reset">Hapus semua data</button></section>`;
}

/* ================= Aksi ================= */
function readInputs(exId){
  return{w:num(document.getElementById('w_'+exId).value),r:Math.round(num(document.getElementById('r_'+exId).value))};
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.action;
  if(a==='tab'){ui.tab=b.dataset.v;render();window.scrollTo(0,0)}
  else if(a==='person'){ui.person=b.dataset.v;render()}
  else if(a==='sess'){ui.sess=b.dataset.v;render()}
  else if(a==='step'){const inp=document.getElementById(b.dataset.t);let v=num(inp.value)+num(b.dataset.d);if(v<0)v=0;inp.value=Math.round(v*100)/100;inp.dispatchEvent(new Event('input',{bubbles:true}))}
  else if(a==='logset'){
    audioUnlock();
    const exId=b.dataset.ex,{w,r}=readInputs(exId);
    if(r<=0){toast('Isi jumlah repetisi/jarak/waktu dulu.');return}
    const s=getOrCreate(ui.date,ui.person,ui.sess);(s.entries[exId]=s.entries[exId]||[]).push({w,r});save();
    startTimer(+b.dataset.rest,EX[exId].name);render();
  }
  else if(a==='delset'){const s=findSession(ui.date,ui.person,ui.sess);if(!s)return;s.entries[b.dataset.ex].splice(+b.dataset.i,1);save();render()}
  else if(a==='savepain'){const s=getOrCreate(ui.date,'istri',ui.sess);s.painDuring=+document.getElementById('painIn').value;save();toast('Skor nyeri disimpan.');render()}
  else if(a==='missPain'){const s=db.sessions.find(x=>x.id===b.dataset.id);s.painNextDay=+document.getElementById('missPain').value;save();toast('Nyeri keesokan hari disimpan.');render()}
  else if(a==='delsess'){if(confirm('Hapus sesi ini beserta semua setnya?')){db.sessions=db.sessions.filter(x=>x.id!==b.dataset.id);save();render()}}
  else if(a==='progPerson'){ui.progPerson=b.dataset.v;ui.progEx=null;render()}
  else if(a==='t-add'){T.end=Math.max(T.end,Date.now())+15000;T.total+=15;T.alerted=false;document.getElementById('timer').classList.remove('done');tick()}
  else if(a==='t-stop')stopTimer();
  else if(a==='export')doExport();
  else if(a==='import')document.getElementById('importFile').click();
  else if(a==='saveSet'){
    db.names.tyo=document.getElementById('nmT').value.trim()||'JuAn';db.names.istri=document.getElementById('nmI').value.trim()||'AnNie';
    const c=num(document.getElementById('ceil').value);if(c>0)db.ceiling=c;db.wake=document.getElementById('wakeIn').checked;save();applyWake();toast('Pengaturan disimpan.');render()}
  else if(a==='testBeep'){audioUnlock();beep()}
  else if(a==='reset'){if(confirm('Hapus SEMUA data latihan?')&&confirm('Yakin? Data yang belum dicadangkan akan hilang permanen.')){db=blank();save();render()}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='painIn'){document.getElementById('painOut').textContent=t.value;return}
  if(t.dataset&&t.dataset.kind){const exId=t.id.slice(2),key=ui.date+ui.person+ui.sess+exId;drafts[key]=drafts[key]||{};drafts[key][t.dataset.kind]=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dateIn'&&t.value){ui.date=t.value;ui.sess=defSess(ui.date);render()}
  else if(t.dataset.action==='progEx'){ui.progEx=t.value;render()}
  else if(t.dataset.action==='painEdit'){const s=db.sessions.find(x=>x.id===t.dataset.id);s[t.dataset.f]=t.value===''?null:+t.value;save();toast('Skor nyeri diperbarui.')}
});
function doExport(){
  db.lastExport=new Date().toISOString();save();
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='log-latihan-'+today()+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Cadangan diunduh.');render();
}
document.getElementById('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.sessions)||d.version!==1)throw new Error('Format file tidak dikenali.');
    const ok=d.sessions.every(s=>s&&typeof s.date==='string'&&(s.person==='tyo'||s.person==='istri')&&(s.sess==='A'||s.sess==='B')&&s.entries&&typeof s.entries==='object');
    if(!ok)throw new Error('Isi file tidak sesuai format log latihan.');
    if(!confirm(`Pulihkan ${d.sessions.length} sesi dari cadangan? Data di HP ini sekarang (${db.sessions.length} sesi) akan diganti.`))return;
    db=Object.assign(blank(),d);save();toast('Data dipulihkan.');render();
  }catch(err){alert('Gagal memulihkan: '+err.message)}
});

render();applyWake();
</script>
